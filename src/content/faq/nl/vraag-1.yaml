question: Kan je ook claims indienen als je met StudentenOV of zakelijk reist?
answer: Ja! Als je een treinvertraging op hebt gelopen terwijl je met StudenenOV
  reist of op kosten van je werk (bijv. NS Business) dan kan je gewoon een claim
  indienen en dan krijg je de vergoeding op je eigen bankrekening.
