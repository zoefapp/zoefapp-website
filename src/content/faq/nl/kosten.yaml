question: Wat kost het om een claim in te dienen?
answer: Het kost je geen geld om een claim in te dienen via de Zoef app. Pas als
  jouw claim is goedgekeurd hanteren wij een marge van 15% van de totale
  vergoeding met een minimum van €0,55 en een maximum van €1,25 om onze kosten
  te kunnen dekken.
