question: Wanneer valt een vertraging onder overmacht?
answer: Als de vervoerder er echt niks aan kon doen dat de treinrit vertraging
  opliep. Twijfel je of jouw vertraging onder overmacht valt? Dien gewoon je
  claim in op de Zoef app en wij zoeken het voor je uit!
